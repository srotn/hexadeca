[project]
name = "hexadeca-alpha-zero"
config_schema_version = 2

[rules]
ruleset_id = "hexadeca-v1"
board_size = 16
neighborhood_radius = 1
action_encoding = "row-major"
starting_player = "black"
distance_metric = "squared-euclidean"
score_occupied_cells = true
tie_break = "next-distance-layer"
majority_award = "majority-count"
zobrist_seed = 7640891576956012809

[network]
feature_schema_id = "hexadeca-v1-16p"
input_planes = 16
residual_blocks = 10
channels = 128
policy_head_channels = 2
value_head_channels = 1
value_hidden_features = 256
policy_size = 256
score_normalizer = 16384.0
batch_norm_epsilon = 0.00001
batch_norm_momentum = 0.1

[mcts]
training_simulations = 800
evaluation_simulations = 1600
c_puct = 2.3
dirichlet_alpha = 0.15
dirichlet_epsilon = 0.25
virtual_loss = 3
inference_batch_size = 32
stochastic_plies = 15
opening_temperature = 1.0
endgame_temperature = 0.0

[replay]
capacity_positions = 200000

[training]
optimizer = "adamw"
learning_rate = 0.0003
batch_size = 256
policy_loss_weight = 1.0
win_loss_weight = 1.0
black_score_loss_weight = 1.0
white_score_loss_weight = 1.0

[benchmark]
board_warmup_iterations = 1000
board_measurement_iterations = 10000
board_position_plies = 32
scoring_warmup_iterations = 100
scoring_measurement_iterations = 1000
environment_warmup_iterations = 100
environment_measurement_iterations = 1000
network_warmup_iterations = 3
network_measurement_iterations = 10
network_cpu_batch_size = 1
network_gpu_batch_sizes = [1, 32, 256]
mcts_warmup_iterations = 2
mcts_measurement_iterations = 5
mcts_benchmark_simulations = 800
random_seed = 20260803

[paths]
run_directory = "runs"
checkpoint_directory = "checkpoints"
log_directory = "logs"
benchmark_directory = "benchmark-results"

[logging]
level = "INFO"
console_enabled = true
file_enabled = true
file_name = "application.jsonl"
