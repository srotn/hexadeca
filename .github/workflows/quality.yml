name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build wheel
        run: python -m build --wheel --no-isolation
      - name: Check formatting
        run: ruff format --check $(git ls-files '*.py')
      - name: Lint
        run: ruff check $(git ls-files '*.py')
      - name: Type check
        # The public project supports optional CUDA/Native integrations whose
        # third-party stubs vary by Python and PyTorch release. Keep this
        # diagnostic visible without blocking the rules and test gate.
        continue-on-error: true
        run: mypy --python-version 3.12 --ignore-missing-imports
      - name: Test
        run: pytest
